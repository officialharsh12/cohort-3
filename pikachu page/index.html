<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu project</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div id="big">
      <img id="pikachu" src="pikachu.png" alt="pikachu" />
      
      <div id="box1">
        <img class="photo" src="./pokemon-logo-png-0.png" alt="pokemon_logo" />
        <img id="ball" src="./Pokemon ball.png" alt="pokemon_ball">
        <h1 id="text">Pikachu</h1>

        <h5 id="text2">POKEMON GEN 1</h5>
        <img id="menu" src="./menu-line.png" alt="menu_png" />
        <img
          id="horizontal"
          src="./End-Point-None--Streamline-Flex.png"
          alt="Horizontal_line"
        />
        <img
          id="dots"
          src="./Menu-Vertical-Dots--Streamline-Micro.png"
          alt="dots"
        />
        <p id="one">01/08</p>
        <p id="text3">
          <span>The world's most iconic Electric-type Pokémon.</span><br />

          <span>Known for courage, friendship, and powerful attacks.</span
          ><br />

          <span>Stores electricity in its cheeks before unleashing it.</span
          ><br />

          <span>A beloved Pokémon that inspires trainers everywhere.</span>
        </p>
      </div>
      <div id="box2"></div>
    </div>

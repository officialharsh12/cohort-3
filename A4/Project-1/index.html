<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Project_1</title>

<body>
    <main>
            <div class="left-top">

                    <h6>Brand Of </h6>

            <div class="center-middle">

            </div>
            <div class="center-btm-1"></div>
            <div class="center-btm-2"></div>
